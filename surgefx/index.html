<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurgeFX Portfolio</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --light-blue: #add8e6;
            --dark-blue: #00008b;
            --white: #ffffff;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-blue);
            color: #333;
            cursor: none; /* We use a custom cursor */
            overflow-x: hidden;
        }

        /* Custom Cursor */
        .cursor {
            width: 20px;
            height: 20px;
            background-color: var(--dark-blue);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
        }

        /* Navigation */
        nav {
            background-color: var(--dark-blue);
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: none; 
        }

        nav a:hover {
            background-color: var(--light-blue);
            color: var(--dark-blue);
            transform: scale(1.1);
        }

        /* Section Layout */
        section {
            padding: 6rem 2rem 4rem 2rem; /* Added top padding for nav bar */
            min-height: 80vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Animation Setup */
            opacity: 0; 
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        /* Section Specifics */
        h1 { font-size: 4rem; color: var(--dark-blue); margin-bottom: 0.5rem; }
        h2 { font-size: 2.5rem; color: var(--dark-blue); margin-bottom: 2rem; border-bottom: 3px solid var(--dark-blue); padding-bottom: 10px; }

        #home, #clients, #reviews { background-color: var(--light-blue); }
        #experience, #my-work { background-color: var(--white); }

        /* Experience Stats */
        .stats-container {
            display: flex;
            gap: 4rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-box {
            background: var(--light-blue);
            padding: 2rem;
            border-radius: 10px;
            min-width: 200px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-number { font-size: 3rem; font-weight: bold; color: var(--dark-blue); margin: 0; }
        .stat-label { font-size: 1.2rem; color: #333; margin-top: 10px; font-weight: bold;}

        /* Clients Loop */
        .clients-container {
            width: 100%;
            max-width: 1000px;
            overflow: hidden;
            position: relative;
            padding: 2rem 0;
            /* Mask to fade edges */
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .clients-loop {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: scroll 30s linear infinite; 
        }

        .clients-loop:hover {
            animation-play-state: paused;
        }

        .client-item {
            width: 200px;
            height: 280px;
            background-color: white;
            border-radius: 10px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: none;
            transition: transform 0.3s;
            flex-shrink: 0;
            text-align: center;
        }

        .client-item:hover { transform: scale(1.05); }
        .client-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--light-blue); margin-bottom: 10px; }
        .client-item h3 { margin: 5px 0; font-size: 1.1rem; color: var(--dark-blue); }
        .client-item .role { font-weight: bold; font-size: 0.8rem; color: #666; margin-bottom: 10px; }
        .client-item .desc { font-size: 0.9rem; font-style: italic; color: #444; }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        /* Popup */
        .client-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 2000;
            width: 320px;
            text-align: center;
            flex-direction: column;
            align-items: center;
            border: 2px solid var(--dark-blue);
        }
        .client-popup.active { display: flex; }
        .client-popup img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 3px solid var(--dark-blue); }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 2rem; cursor: pointer; color: var(--dark-blue); }

        /* Work Gallery */
        .work-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            width: 80%;
            max-width: 900px;
            height: 500px; 
            overflow-y: auto; 
            padding: 15px;
            background-color: #f0f8ff;
            border: 2px solid var(--dark-blue);
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .work-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            transition: transform 0.3s;
            display: block;
            border: 1px solid #ddd;
        }
        .work-item img:hover { transform: scale(1.02); }

        /* Reviews */
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 700px;
        }

        .review-item {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            display: flex;
            flex-direction: column; 
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        .review-item:hover { transform: translateY(-5px); }

        .review-header img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; object-fit: cover; }
        .stars { color: gold; font-size: 1.5rem; margin: 10px 0; }
        .review-text { font-style: italic; color: #555; margin-bottom: 1rem; line-height: 1.5;}

        /* Buttons */
        button.check-out-btn {
            background-color: var(--dark-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: none; /* Custom cursor */
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }
        button.check-out-btn:hover { 
            background-color: var(--light-blue); 
            color: var(--dark-blue); 
            transform: scale(1.05);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--dark-blue); border-radius: 5px; }
    </style>
</head>
<body>

    <div class="cursor"></div>

    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#clients">Clients</a></li>
            <li><a href="#my-work">My Work</a></li>
            <li><a href="#reviews">Reviews</a></li>
        </ul>
    </nav>

    <section id="home">
        <h1>SurgeFX</h1>
        <p style="font-size: 1.5rem;">Professional Design & Creative Works</p>
    </section>

    <section id="experience">
        <h2>Experience</h2>
        <div class="stats-container">
            <div class="stat-box">
                <p class="stat-number">200k+</p>
                <p class="stat-label">Views Generated</p>
            </div>
            <div class="stat-box">
                <p class="stat-number">1 Year</p>
                <p class="stat-label">Professional Experience</p>
            </div>
        </div>
    </section>

    <section id="clients">
        <h2>Clients</h2>
        <div class="clients-container">
            <div class="clients-loop">
                </div>
        </div>
        
        <div class="client-popup" id="client-popup">
            <span class="close-btn" id="close-btn">&times;</span>
            <img id="client-pfp" src="" alt="Client Profile Picture">
            <h3 id="client-name"></h3>
            <p id="client-occupation" style="color: var(--dark-blue); font-weight: bold;"></p>
            <p id="client-description"></p>
            </div>
    </section>

    <section id="my-work">
        <h2>My Work</h2>
        <div class="work-gallery">
            </div>
    </section>

    <section id="reviews">
        <h2>Reviews</h2>
        <div class="review-list">
            </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- 1. Custom Cursor ---
            const cursor = document.querySelector('.cursor');
            document.addEventListener('mousemove', function(e) {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });

            // --- 2. Scroll Animation (Fade in sections) ---
            const sections = document.querySelectorAll('section');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });

            sections.forEach(section => {
                observer.observe(section);
            });

            // --- 3. Clients Logic ---
            const clientsLoop = document.querySelector('.clients-loop');
            
            // CONFIG: Configure your clients here
            const clientsData = [
                { name: '@Prismfnr', description: '"Insane energy, huge moves."', occupation: 'PRO', pfp: 'SetImages/prismpfp.jpg', link: 'https://x.com/prismfnr' },
                { name: '@skyszn', description: '"Always watching, always scrolling."', occupation: 'SCROLLS DUO', pfp: 'SetImages/skyszn.jpg', link: 'https://x.com/SkySZN_' },
                { name: '@kirillianfnx', description: '"And Poof... You are gone!"', occupation: 'Best Aimer', pfp: 'SetImages/kirillianpfp.jpg', link: 'https://x.com/kirillianfnx' },
                { name: 'Generic Pro', description: 'Next level plays.', occupation: 'Comp Player', pfp: 'SetImages/default.jpg', link: '#' },
                { name: 'Unknown User', description: 'Hidden talent.', occupation: 'Creative Warrior', pfp: 'SetImages/default.jpg', link: '#' },
                { name: 'Surge Fan', description: 'Big supporter.', occupation: 'Community', pfp: 'SetImages/default.jpg', link: '#' },
                { name: 'MORE', description: '40+ more clients', occupation: '+', pfp: 'SetImages/andmorepfp.jpg', link: 'https://surgefx.space' }
            ];

            function createClientCard(client) {
                const card = document.createElement('div');
                card.classList.add('client-item');
                
                card.innerHTML = `
                    <img src="${client.pfp}" alt="Client" onerror="this.src='https://via.placeholder.com/150/00008b/ffffff?text=User'">
                    <h3>${client.name}</h3>
                    <div class="role">${client.occupation}</div>
                    <div class="desc">${client.description}</div>
                `;

                card.addEventListener('click', () => {
                    const popup = document.getElementById('client-popup');
                    document.getElementById('client-name').textContent = client.name;
                    document.getElementById('client-description').textContent = client.description;
                    document.getElementById('client-occupation').textContent = client.occupation;
                    document.getElementById('client-pfp').src = client.pfp;
                    
                    const oldBtn = document.getElementById('client-link-btn');
                    if(oldBtn) oldBtn.remove();

                    const btn = document.createElement('button');
                    btn.textContent = "Check it out";
                    btn.id = "client-link-btn";
                    btn.classList.add('check-out-btn');
                    btn.onclick = () => window.open(client.link, '_blank');
                    
                    popup.appendChild(btn);
                    popup.classList.add('active');
                });

                return card;
            }

            // Duplicate data for seamless loop
            [...clientsData, ...clientsData].forEach(client => {
                clientsLoop.appendChild(createClientCard(client));
            });

            // Close Popup
            document.getElementById('close-btn').addEventListener('click', () => {
                document.getElementById('client-popup').classList.remove('active');
            });

            // --- 4. My Work Logic ---
            const workGallery = document.querySelector('.work-gallery');
            // CONFIG: Add image file names here
            const workImages = [
                'WorkImages/surgework1.jpg', 'WorkImages/surgework2.jpg',
                'WorkImages/surgework3.jpg', 'WorkImages/surgework4.jpg',
                'WorkImages/surgework5.jpg', 'WorkImages/surgework6.jpg',
                'WorkImages/surgework7.jpg', 'WorkImages/surgework8.jpg'
            ];

            workImages.forEach(src => {
                const item = document.createElement('div');
                item.classList.add('work-item');
                const img = document.createElement('img');
                img.src = src;
                img.alt = "Portfolio Work";
                // Hide broken images to keep layout clean
                img.onerror = function() { this.style.display='none'; }; 
                item.appendChild(img);
                workGallery.appendChild(item);
            });

            // --- 5. Reviews Logic ---
            const reviewList = document.querySelector('.review-list');
            const reviewsData = [
                {
                    name: '@Fraanticc',
                    occupation: 'Female Fortnite Player',
                    review: "Honestly blown away by the creativity. The design feels alive and matches my brand perfectly. Super fast delivery too!",
                    stars: 5,
                    pfp: 'SetImages/fraanticpfp.jpg',
                    link: 'https://x.com/Fraanticc'
                },
                {
                    name: '@higgs',
                    occupation: 'Pro Player',
                    review: "Cleanest thumbnails in the game. SurgeFX knows exactly how to capture attention. 10/10 recommend.",
                    stars: 5,
                    pfp: 'SetImages/higgspfp.jpg',
                    link: 'https://x.com/BatmanBugha'
                },
                {
                    name: '@200Pxmp',
                    occupation: 'Pro Player',
                    review: "Professional quality that actually stands out. The turnaround time was insane for this level of detail.",
                    stars: 5,
                    pfp: 'SetImages/pxmppfp.jpg',
                    link: 'https://x.com/200_PXMP'
                },
                {
                    name: '@Joshreyli',
                    occupation: 'Upcoming Prodigy',
                    review: "Exactly what I asked for, but better. The animations and color grading are top tier. Def working together again.",
                    stars: 5,
                    pfp: 'SetImages/joshreylipfp.jpg',
                    link: 'https://x.com/Joshreyli'
                },
                {
                    name: '@Tjino9',
                    occupation: 'Pro Player',
                    review: "Unique style that you don't see everyday. Super easy to work with and understood the assignment immediately.",
                    stars: 5,
                    pfp: 'SetImages/tjinopfp.jpg',
                    link: 'https://x.com/Tjino9'
                }
            ];

            reviewsData.forEach(rev => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                const starsHTML = '★'.repeat(rev.stars);
                
                item.innerHTML = `
                    <div class="review-header">
                        <img src="${rev.pfp}" alt="${rev.name}" onerror="this.src='https://via.placeholder.com/60/00008b/ffffff?text=User'">
                        <h3>${rev.name}</h3>
                        <small style="color: #888;">${rev.occupation}</small>
                    </div>
                    <div class="stars">${starsHTML}</div>
                    <p class="review-text">"${rev.review}"</p>
                `;

                const btn = document.createElement('button');
                btn.textContent = 'Check it out';
                btn.classList.add('check-out-btn');
                btn.onclick = () => window.open(rev.link, '_blank');
                
                item.appendChild(btn);
                reviewList.appendChild(item);
            });
            
            // --- 6. Smooth Scroll Logic ---
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            });
        });
    </script>
</body>
</html>
